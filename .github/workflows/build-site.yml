name: Build Site from CMS Content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "admin/config.yml"
      - "assets/uploads/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Commit and push rendered HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            about-us/index.html \
            impact/index.html \
            stories \
            donate/index.html \
            contact-us/index.html \
            get-involved/index.html \
            students/index.html \
            assets/uploads
          if git diff --staged --quiet; then
            echo "No HTML changes to commit."
          else
            git commit -m "chore: rebuild site from CMS content"
            git push
          fi
