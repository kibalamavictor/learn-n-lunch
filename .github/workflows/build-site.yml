name: Build Site from CMS Content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "admin/config.yml"
      - "assets/uploads/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # Pages artifacts must stay small — never ship node_modules
      - name: Prune build dependencies before Pages upload
        run: rm -rf node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync rendered HTML back to repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p assets/uploads
          git add \
            index.html \
            about-us/index.html \
            impact/index.html \
            stories \
            donate/index.html \
            contact-us/index.html \
            get-involved/index.html \
            students/index.html \
            sitemap.xml \
            robots.txt
          git add assets/uploads/* 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No HTML changes to commit."
            exit 0
          fi

          # [skip ci] prevents Deploy static site from re-running and queuing
          # a second Pages deployment behind this one (which caused timeouts).
          git commit -m "chore: rebuild site from CMS content [skip ci]"

          if git push origin HEAD:main; then
            echo "Synced rendered HTML via direct push to main."
            exit 0
          fi

          echo "Direct push blocked by branch protection; opening sync PR..."
          git reset --soft HEAD~1
          SYNC_BRANCH="bot/sync-rendered-html-${GITHUB_RUN_ID}"
          git checkout -b "${SYNC_BRANCH}"
          git commit -m "chore: rebuild site from CMS content [skip ci]"
          git push -u origin "${SYNC_BRANCH}"

          PR_NUMBER=$(gh pr create \
            --base main \
            --head "${SYNC_BRANCH}" \
            --title "chore: rebuild site from CMS content" \
            --body "Automated HTML sync after CMS build. Deploy already completed." \
            --json number --query .number)

          gh pr merge "${PR_NUMBER}" --auto --merge
          echo "Opened PR #${PR_NUMBER} for auto-merge."
