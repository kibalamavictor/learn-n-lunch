name: Build Site from CMS Content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "admin/config.yml"
      - "assets/uploads/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync rendered HTML back to repo
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            about-us/index.html \
            impact/index.html \
            stories \
            donate/index.html \
            contact-us/index.html \
            get-involved/index.html \
            students/index.html \
            assets/uploads
          if git diff --staged --quiet; then
            echo "No HTML changes to commit."
            exit 0
          fi
          git commit -m "chore: rebuild site from CMS content"
          git pull --rebase origin main
          git push origin HEAD:main
