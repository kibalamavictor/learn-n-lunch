name: Build Site from CMS Content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "admin/config.yml"
      - "assets/uploads/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync rendered HTML back to repo
        id: sync
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore: rebuild site from CMS content
          title: chore: rebuild site from CMS content
          body: |
            Automated sync of rendered HTML after a CMS content change.
            Deploy already completed; this PR keeps the repo HTML in sync with `content/`.
          branch: bot/sync-rendered-html
          base: main
          delete-branch: true
          labels: automated, cms-sync
          add-paths: |
            index.html
            about-us/index.html
            impact/index.html
            stories/
            donate/index.html
            contact-us/index.html
            get-involved/index.html
            students/index.html
            assets/uploads/

      - name: Auto-merge HTML sync PR
        if: steps.sync.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.sync.outputs.pull-request-number }}" --auto --merge
