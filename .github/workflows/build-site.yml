name: Build Site from CMS Content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "admin/config.yml"
      - "assets/uploads/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync rendered HTML back to repo
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            about-us/index.html \
            impact/index.html \
            stories \
            donate/index.html \
            contact-us/index.html \
            get-involved/index.html \
            students/index.html \
            assets/uploads

          if git diff --staged --quiet; then
            echo "No HTML changes to commit."
            echo "pull-request-number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="bot/sync-rendered-html-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: rebuild site from CMS content"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: rebuild site from CMS content" \
            --body "Automated sync of rendered HTML after a CMS content change. Deploy already completed; this PR keeps the repo HTML in sync with content/.")
          PR_NUMBER="${PR_URL##*/}"
          echo "pull-request-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Auto-merge HTML sync PR
        if: steps.sync.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.sync.outputs.pull-request-number }}" --auto --merge
