name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "content/**"
      - "scripts/**"
      - "admin/config.yml"
      - "assets/uploads/**"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether to deploy
        id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG="${{ github.event.head_commit.message }}"
          if printf '%s' "$MSG" | grep -qE '\[skip ci\]|\[skip actions\]'; then
            echo "Commit requested skip — not deploying."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(content/|scripts/|admin/config\.yml|assets/uploads/)'; then
              echo "CMS content changed on this push — build-site.yml owns Pages deploy."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
